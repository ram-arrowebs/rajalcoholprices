name: Fetch price list

on:
  schedule:
    # 03:30 UTC = 09:00 IST, daily
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

# The IEMS host only accepts connections from Indian IP addresses, and
# GitHub-hosted runners are not in India. scripts/proxy/deploy.sh stands up
# a fixed-target proxy Lambda in AWS Mumbai behind an IAM-authenticated
# Function URL and sets the first three of these
# (Settings > Secrets and variables > Actions):
#   SOURCE_URL             variable: the proxy's Function URL; unset uses
#                          the IEMS endpoint directly
#   AWS_ACCESS_KEY_ID      secrets: keys of an IAM user that may only
#   AWS_SECRET_ACCESS_KEY  invoke that URL; the fetch script SigV4-signs
#   FETCH_RUNNER           variable: label of a self-hosted runner located in
#                          India, e.g. "self-hosted", as an alternative to
#                          the proxy; unset falls back to ubuntu-latest
env:
  SOURCE_URL: ${{ vars.SOURCE_URL || 'https://iems.rajasthan.gov.in/ApprovedRateList/ApprovedRateList/ApprovedRateGridList?type=0' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TARGET: data/prices.json
  META: data/meta.json

jobs:
  fetch:
    runs-on: ${{ vars.FETCH_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      # Downloads to a temp file and only writes data/ after the payload
      # validates, so any failure leaves the previous committed data in
      # place and fails the run so it is visible.
      - name: Download and validate source
        run: scripts/fetch-prices.sh

      - name: Commit and push if changed
        run: |
          # data/ is gitignored for local development; force-add here.
          git add -f "$TARGET" "$META"
          if git diff --cached --quiet -- "$TARGET"; then
            echo "Price data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update price list $(date -u +%Y-%m-%d)"
          git push
