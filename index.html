<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta http-equiv="”Pragma”" content="”no-cache”" />
  <meta http-equiv="”Expires”" content="”-1″" />
  <meta http-equiv="”CACHE-CONTROL”" content="”NO-CACHE”" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Alcohol Price List - Rajasthan, India</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.1/css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.0/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css" />
  <link rel="apple-touch-icon" sizes="57x57" href="./icon/apple-icon-57x57.png" />
  <link rel="apple-touch-icon" sizes="60x60" href="./icon/apple-icon-60x60.png" />
  <link rel="apple-touch-icon" sizes="72x72" href="./icon/apple-icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="76x76" href="./icon/apple-icon-76x76.png" />
  <link rel="apple-touch-icon" sizes="114x114" href="./icon/apple-icon-114x114.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="./icon/apple-icon-120x120.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="./icon/apple-icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="./icon/apple-icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon/apple-icon-180x180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/android-icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="./icon/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icon/favicon-16x16.png" />
  <meta name="msapplication-TileColor" content="#ffffff" />
  <meta name="msapplication-TileImage" content="./ms-icon-144x144.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" type="text/css" href="./styles.css" />
</head>

<body>
  <div id="root" style="padding: 0.5rem 1rem">
    <h5>
      Rajasthan Alcohol Prices &nbsp;&nbsp;<a href="./qr-code.png" target="_blank"><i class="bi bi-share"></i></a>
    </h5>

    <!-- let's bring the table here -->
    <table id="rajprice" class="table table-striped table-hover table-sm" style="width: 100%">
      <thead>
        <tr>
          <th>Item</th>
          <th>Packing</th>
          <th>Price</th>
        </tr>
      </thead>
    </table>
    <div>
      <span class="float-start small"><a href="./qr-code.png" target="_blank">Share & Spread</a>
        &#127867;</span>
      <span id="lastupdate" class="float-end small"></span>
      <p>&nbsp;</p>
    </div>
    <div id="overlay">
      <svg class="spinner" viewBox="0 0 50 50">
        <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
      </svg>
    </div>
    <button class="add-button">Add to home screen</button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script type="text/javascript" charset="utf8"
    src="https://cdn.datatables.net/1.11.0/js/jquery.dataTables.min.js"></script>
  <script type="text/javascript" charset="utf8"
    src="https://cdn.datatables.net/1.11.0/js/dataTables.bootstrap5.min.js"></script>

  <script type="text/javscript" charset="utf8" src="./a2hs.js"></script>
  <script type="text/javascript">
    // Price data is a snapshot of the IEMS approved-rate JSON, refreshed
    // daily into ./data by .github/workflows/fetch-prices.yml
    var pricesUrl = "./data/prices.json";
    var metaUrl = "./data/meta.json";

    $(document).ready(function () {
      $("#overlay").show();

      fetch(pricesUrl, { cache: "no-cache" })
        .then((res) => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then((json) => {
          var rows = (json.data || []).map((row) => [
            row.BrandName,
            row.Packing + "ml",
            row.MRP,
          ]);
          feedDataTable(rows);
        })
        .catch((err) => {
          console.error("Failed to load price data", err);
          $("#overlay").hide();
          $("#lastupdate").text("Could not load price data.");
        });

      fetch(metaUrl, { cache: "no-cache" })
        .then((res) => (res.ok ? res.json() : null))
        .then((meta) => {
          if (meta && meta.fetchedAt) {
            $("#lastupdate").text(
              "Updated " + new Date(meta.fetchedAt).toLocaleDateString("en-IN")
            );
          }
        })
        .catch(() => {});
    });

    function toProperCase(str) {
      return str
        .toLowerCase()
        .replace(/(^|\s|\.)\w/g, (char) => char.toUpperCase()); // Capitalize after start, space, or dot
    }

    function toIndianRupeeFormat(price) {
      return Number(price).toLocaleString("en-IN", {
        style: "currency",
        currency: "INR",
        minimumFractionDigits: 0,
      });
    }

    function feedDataTable(dataSet) {
      $("#rajprice").DataTable({
        data: dataSet,
        pageLength: 20,
        pagingType: "simple",
        columns: [
          {
            render: function (data) {
              return toProperCase(data);
            },
          },
          { className: "dt-right small-font" },
          {
            className: "dt-right",
            render: function (data, type) {
              return type === "display" ? toIndianRupeeFormat(data) : data;
            },
          },
        ],
        lengthChange: false,
        fnInitComplete: function () {
          $("#overlay").hide();
          this.api()
            .columns()
            .every(function(){
              var column = this;
              console.log(column.index());

              var select = $('<select><option value=""></option></select>')
                .appendTo($(column.footer()).empty())
                .on('change', function() {
                  column.search($(this).val(), {exact: true}).draw();
                });

              column.data().unique().sort().each( function(d, j) {
                select.append('<option value="' + d + '">' + d + '</option>');
            });

          });
        },
      });
    }
  </script>

</body>

</html>
